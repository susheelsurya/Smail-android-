window.runMailDispatcher = async (uid) => {
    try {
        if (!uid) return;
        
        const now = new Date().getTime(); // ప్రస్తుత సమయం మిల్లీ సెకండ్లలో
        
        // కేవలం 'pending' స్టేటస్ ఉన్న షెడ్యూల్డ్ మెయిల్స్ ని మాత్రమే తీసుకుంటున్నాం
        const q = query(
            collection(db, "users", uid, "scheduled_mails"), 
            where("status", "==", "pending")
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
            //.log("No pending scheduled mails.");
            return;
        }

        snapshot.forEach(async (docSnap) => {
            const data = docSnap.data();
            const scheduleTime = new Date(data.sendAt).getTime(); // యూజర్ సెట్ చేసిన టైమ్

            // సమయం దాటిపోయి ఉంటేనే ప్రాసెస్ చేయాలి
            if (scheduleTime <= now) {
                const docId = docSnap.id;

                //.log(`Dispatching mail: ${data.subject} to ${data.recipientEmail}`);

                // window.sendSmail ని పిలుస్తున్నాం
                // ఇక్కడ customTime గా data.sendAt ని పంపిస్తున్నాం (సో రిసీవర్ కి ఆ టైమే కనిపిస్తుంది)
                const res = await window.sendSmail(
                    data.recipientEmail, 
                    data.senderEmail, 
                    data.subject, 
                    data.message || data.body, // ఇక్కడ డేటా మిస్ అవ్వకుండా చెక్ చేస్తున్నాం
                    data.senderName,
                    data.sendAt 
                );

                if (res.success) {
                    // పంపడం సక్సెస్ అయితే Firestore లో స్టేటస్ ని 'sent' గా మారుస్తున్నాం
                    await updateDoc(doc(db, "users", uid, "scheduled_mails", docId), {
                        status: "sent",
                        deliveredAt: serverTimestamp()
                    });
                    //.log("Smail Delivered Successfully for doc:", docId);
                } else {
                    //console.error("Failed to deliver scheduled smail:", res.error);
                }
            }
        });
    } catch (e) {
        //console.error("Dispatcher Global Error:", e);
    }
};




        // E. Fetch Messages (Inbox & Sent)
        window.getMessages = (uid, callback) => {

                if (!searchText) return [];
                const searchLower = searchText.toLowerCase().trim();
                const q = query(
                    collection(db, "public_profiles"),
                    where("smail", ">=", searchLower),
                    where("smail", "<=", searchLower + "\uf8ff"),
                    limit(10)
                );
                const querySnapshot = await getDocs(q);
                return querySnapshot.docs.map(doc => doc.data());
            } catch (error) {
                return [];
            }
        };
        


window.moveToBin = async (uid, messageId, mailData) => {
    try {
        const { id, ...dataToCopy } = mailData;
        
        // 1. బిన్ లోకి పంపడం
        await addDoc(collection(db, "users", uid, "bin"), {
            ...dataToCopy,
            deletedAt: serverTimestamp(),
            originalId: messageId // మెయిన్ emails ID ని ఇక్కడ దాచుకోవాలి
        });

        // 2. యూజర్ ప్రొఫైల్ లో ఈ ID ని 'deletedMails' లో యాడ్ చేయడం (ఇది ముఖ్యం)
        await updateDoc(doc(db, "users", uid), {
            deletedMails: arrayUnion(messageId)
        });

        // 3. ఇన్బాక్స్ నుండి డిలీట్ చేయడం
        await deleteDoc(doc(db, "users", uid, "inbox", messageId));
        return { success: true };
    } catch (error) {
        return { success: false, error: error.message };
    }
};

    window.getscheduledmails = (uid, callback) => {
    try {
        if (!uid) return;

        // orderBy తీసేసాను, సో ఇండెక్స్ అవసరం లేదు. 
        // కేవలం 'pending' మెయిల్స్ మాత్రమే వస్తాయి.
        const q = query(
            collection(db, "users", uid, "scheduled_mails"), 
            where("status", "==", "pending")
        );

        // Real-time listener
        return onSnapshot(q, (snapshot) => {
            const scheduledData = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));

            // JavaScript లోనే సార్టింగ్ చేద్దాం (Firestore ఇండెక్స్ తో పనిలేకుండా)
            scheduledData.sort((a, b) => new Date(a.sendAt) - new Date(b.sendAt));

            callback(scheduledData);
        }, (error) => {
            //.error("Error fetching scheduled mails:", error);
        });
    } catch (e) {
        //.error("getscheduledmails Error:", e);
    }
};

    window.updateUserProfile = async (uid, data) => {
    try {
        const userRef = doc(db, "users", uid);
        
        // 1. Auth Password Update
        if (data.password) {
            const user = auth.currentUser;
            if (user) {
                // పైన ఇంపోర్ట్ చేసిన updatePassword ని ఇక్కడ వాడుతున్నాం
                await updatePassword(user, data.password);
                //.log("Auth Password updated");
            }
        }

        // 2. Firestore Update
        // updatedAt కోసం సరైన ఫార్మాట్ వాడుతున్నాం
        await updateDoc(userRef, {
            ...data,
            updatedAt: new Date().toISOString() 
        });

        return { success: true };
    } catch (error) {
        //.error("Master Update Error:", error);
        // యూజర్ కి అర్థమయ్యేలా ఎర్రర్ మెసేజ్ పంపడం
        return { success: false, error: error.message };
    }
};


// index.html లో ఇంపోర్ట్స్ లో ఇవి యాడ్ చెయ్
import { EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

window.verifyUserPassword = async (password) => {
    try {
        const user = auth.currentUser;
        if (!user) return { success: false, error: "No user logged in" };

        const credential = EmailAuthProvider.credential(user.email, password);
        await reauthenticateWithCredential(user, credential);
        
        return { success: true };
    } catch (error) {
        return { success: false, error: "Incorrect Password. Please try again." };
    }
};

window.createNewGroup = async (groupId, adminUid) => {
    try {
        const groupRef = doc(db, "groups", groupId);
        const snap = await getDoc(groupRef);
        if (snap.exists()) return { success: false, error: "Group name already taken" };

        await setDoc(groupRef, {
            adminUid: adminUid,
            members: [adminUid], // Admin default గా మెంబర్
            createdAt: serverTimestamp()
        });
        return { success: true };
    } catch (e) { return { success: false, error: e.message }; }
};

// మెంబర్ ని యాడ్ చేయడం
window.addMemberToGroup = async (groupId, memberSmail, adminUid) => {
    try {
        const q = query(collection(db, "public_profiles"), where("smail", "==", memberSmail.toLowerCase()));
        const snap = await getDocs(q);
        if (snap.empty) return { success: false, error: "User not found" };
        
        const memberUid = snap.docs[0].id;
        await updateDoc(doc(db, "groups", groupId), {
            members: arrayUnion(memberUid)
        });
        return { success: true };
    } catch (e) { return { success: false, error: e.message }; }
};

window.listenToMyGroups = (uid, callback) => {

        // యూజర్ మెంబర్ గా ఉన్న గ్రూప్స్ అన్నింటినీ వెతుకుతుంది
        const q = query(
            collection(db, "groups"), 
            where("members", "array-contains", uid)
        );

        return onSnapshot(q, async (snapshot) => {
            const groups = [];
            
            // ప్రతి గ్రూప్ లోని మెంబర్స్ వివరాలను (smail) కూడా తెచ్చుకోవాలి కాబట్టి...
            for (const docSnap of snapshot.docs) {
                const groupData = docSnap.data();
                const memberDetails = [];
                
                // మెంబర్స్ smail ఐడిల కోసం పబ్లిక్ ప్రొఫైల్స్ ని చెక్ చేయడం
                for (const mUid of groupData.members) {
                    const pSnap = await getDoc(doc(db, "public_profiles", mUid));
                    if (pSnap.exists()) {
                        memberDetails.push({ uid: mUid, smail: pSnap.data().smail });
                    }
                }
                
                groups.push({
                    id: docSnap.id,
                    ...groupData,
                    membersData: memberDetails
                });
            }
            callback(groups);
        });
    } catch (e) {
        //.error("Listen Groups Error:", e);
    }
};

// 2. గ్రూప్ ని డిలీట్ చేయడానికి
window.deleteGroup = async (groupId, adminUid) => {
    try {
        const groupRef = doc(db, "groups", groupId);
        const snap = await getDoc(groupRef);
        
        if (snap.exists() && snap.data().adminUid === adminUid) {
            await deleteDoc(groupRef);
            return { success: true };
        } else {
            return { success: false, error: "Only admin can delete group" };
        }
    } catch (e) {
        return { success: false, error: e.message };
    }
};

window.sendSmail = async (toSmail, fromSmail, subject, message, senderName, customTime = null) => {
    try {
        const rSmail = toSmail.toLowerCase().trim();
        const sSmail = fromSmail.toLowerCase().trim();
        const senderUid = auth.currentUser.uid;

        //.log("Sending mail to:", rSmail); // డీబగ్గింగ్ కోసం

        const mailData = {
            name: senderName || "Smail User",
            from: sSmail,
            to: rSmail,
            subject: subject || "(No Subject)",
            body: message || "",
            time: customTime ? new Date(customTime) : serverTimestamp(),
            isRead: false,
            mailUID: crypto.randomUUID()
        };

        // --- GROUP MAIL LOGIC ---
        // ఇక్కడ rSmail కచ్చితంగా "-group@smails.in" కలిగి ఉందో లేదో చూస్తుంది
        if (rSmail.includes("-group@smails.in")) {
            //.log("Detected as Group Mail");
            const groupRef = doc(db, "groups", rSmail);
            const groupSnap = await getDoc(groupRef);

            if (groupSnap.exists()) {
                const groupData = groupSnap.data();
                const members = groupData.members;

                if (!members || members.length === 0) {
                    return { success: false, error: "Group has no members!" };
                }

                //.log("Group found, members count:", members.length);

                // ప్రతి మెంబర్ ఇన్బాక్స్‌లోకి మెయిల్ కాపీ చేయడం
                const promises = members.map(mUid => {
                    return addDoc(collection(db, "users", mUid, "inbox"), { 
                        ...mailData, 
                        isGroupMail: true,
                        viaGroup: rSmail 
                    });
                });
                
                await Promise.all(promises);
                // పంపిన వాడి 'sent' ఫోల్డర్‌లో ఒక కాపీ
                await addDoc(collection(db, "users", senderUid, "sent"), mailData);
                
                //.log("Group mail sent successfully to all members!");
                return { success: true };
            } else {
               //.error("Group ID not found in Firestore:", rSmail);
                return { success: false, error: "Smail Group not found! Check the ID." };
            }
        }

        // --- NORMAL MAIL LOGIC ---
        //.log("Detected as Normal Mail");
        const q = query(collection(db, "public_profiles"), where("smail", "==", rSmail));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) return { success: false, error: "Recipient not found" };

        const receiverUid = querySnapshot.docs[0].id;
        await addDoc(collection(db, "users", receiverUid, "inbox"), mailData);
        await addDoc(collection(db, "users", senderUid, "sent"), mailData);
        
        return { success: true };
    } catch (error) {
        //.error("sendSmail Error:", error);
        return { success: false, error: error.message };
    }
};

    // గ్రూప్ నుండి మెంబర్‌ని తీసేయడం
window.removeMemberFromGroup = async (groupId, memberUid, adminUid) => {
    try {
        const groupRef = doc(db, "groups", groupId);
        const snap = await getDoc(groupRef);

        if (!snap.exists()) return { success: false, error: "Group not found" };
        
        // కేవలం అడ్మిన్ మాత్రమే మెంబర్‌ని తీసేయగలడు
        if (snap.data().adminUid !== adminUid) {
            return { success: false, error: "Only admin can remove members" };
        }

        // అడ్మిన్ తనని తాను గ్రూప్ నుండి తీసేసుకోలేడు (ఒకవేళ కావాలంటే ఈ కండిషన్ తీసేయొచ్చు)
        if (memberUid === adminUid) {
            return { success: false, error: "Admin cannot be removed" };
        }


        await updateDoc(groupRef, {
            members: arrayRemove(memberUid)
        });

        return { success: true };
    } catch (e) {
        return { success: false, error: e.message };
    }
};

    window.listenForRealtimeEmails = (
    userEmail,
    userUid,
    callback = null
) => {

    try {

        const emailLower =
            userEmail.toLowerCase().trim();

        const q = query(
            collection(db, "emails"),
            where("receiver", "==", emailLower)
        );

        return onSnapshot(q, async (snapshot) => {

            const userDoc =
                await getDoc(
                    doc(db, "users", userUid)
                );

            const deletedMails =
                userDoc.data()?.deletedMails || [];

            for (const change of snapshot.docChanges()) {

                if (change.type !== "added")
                    continue;

                const mailDoc = change.doc;

                const mailData =
                    mailDoc.data();

                const mailId =
                    mailDoc.id;

                // already deleted/bin
                if (
                    deletedMails.includes(mailId)
                ) {
                    continue;
                }

                // inbox check
                const inboxRef = doc(
                    db,
                    "users",
                    userUid,
                    "inbox",
                    mailId
                );

                const inboxSnap =
                    await getDoc(inboxRef);

                if (inboxSnap.exists()) {
                    continue;
                }

                // labels check
                const labelsSnap =
                    await getDocs(
                        collection(
                            db,
                            "users",
                            userUid,
                            "labels"
                        )
                    );

                let existsInLabels = false;

                for (const label of labelsSnap.docs) {

                    const labelMail =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                userUid,
                                "labels",
                                label.id,
                                "mails",
                                mailId
                            )
                        );

                    if (labelMail.exists()) {

                        existsInLabels = true;

                        break;

                    }

                }

                if (existsInLabels)
                    continue;

                // ORIGINAL TIME
                const originalTime =
                    mailData.receivedAt
                    ?
                    new Date(mailData.receivedAt)
                    :
                    new Date();

                // JUNK FILTER
                const junkRef =
                    mailData.isJunk
                    ?
                    "junk"
                    :
                    "inbox";

                await setDoc(
                    doc(
                        db,
                        "users",
                        userUid,
                        junkRef,
                        mailId
                    ),
                    {

                        ...mailData,

                        time: originalTime,

                        syncedAt:
                            serverTimestamp()

                    }
                );

                if (callback) {
                    callback(mailData);
                }

            }

        });

    } catch (e) {

        console.log(e);

    }

};
